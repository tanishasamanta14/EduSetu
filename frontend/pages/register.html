<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create Your EduSetu Account — Join India's AI-powered diagnostic learning platform.">
  <title>Sign Up — EduSetu</title>

  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/app-shell.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      position: relative;
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      padding: 38px 36px;
      background: rgba(14, 22, 42, 0.85);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(139, 92, 246, 0.1);
      position: relative;
      z-index: 2;
    }

    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 20px;
    }

    .auth-logo-badge {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
      margin-bottom: 10px;
      color: #fff;
    }

    .auth-brand-name {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.55rem;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .auth-brand-name span {
      color: var(--gold-primary);
    }

    .auth-heading {
      font-family: var(--font-heading);
      font-size: 1.45rem;
      font-weight: 700;
      color: #FFFFFF;
      margin-top: 10px;
      text-align: center;
    }

    .auth-subtitle {
      font-size: 0.875rem;
      color: var(--text-secondary);
      text-align: center;
      margin-top: 4px;
      margin-bottom: 20px;
    }

    .btn-oauth-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 11px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      color: var(--text-white);
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      margin-bottom: 16px;
    }

    .btn-oauth-google:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      color: var(--text-muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 0.825rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .auth-status-msg {
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      margin-bottom: 14px;
      display: none;
    }

    .auth-status-msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #FCA5A5;
    }

    .auth-status-msg.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6EE7B7;
    }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--gold-primary);
      text-decoration: none;
      font-weight: 600;
      margin-left: 4px;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body class="auth-page">

  <div class="ambient-glow-canvas"></div>

  <div class="auth-card">
    <div class="auth-brand">
      <a href="index.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center;">
        <div class="auth-logo-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        </div>
        <div class="auth-brand-name">Edu<span>Setu</span></div>
      </a>
      <h1 class="auth-heading">Create Your Account</h1>
      <p class="auth-subtitle">Join EduSetu and start learning</p>
    </div>

    <!-- Google OAuth Button -->
    <button class="btn-oauth-google" id="btnGoogleAuth" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-divider">or</div>

    <div id="authStatusMsg" class="auth-status-msg"></div>

    <form id="registerForm">
      <div class="form-group">
        <label class="form-label" for="regName">Full Name</label>
        <input type="text" id="regName" class="glass-input" placeholder="Enter your name" required autocomplete="name">
      </div>

      <div class="form-group">
        <label class="form-label" for="regEmail">Email</label>
        <input type="email" id="regEmail" class="glass-input" placeholder="Enter your email" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="regPassword">Password</label>
        <input type="password" id="regPassword" class="glass-input" placeholder="Create a password (min 6 chars)" required autocomplete="new-password">
      </div>

      <div class="form-group">
        <label class="form-label" for="regConfirmPassword">Confirm Password</label>
        <input type="password" id="regConfirmPassword" class="glass-input" placeholder="Confirm your password" required autocomplete="new-password">
      </div>

      <button type="submit" class="btn-gold-primary" id="btnRegisterSubmit" style="width: 100%; padding: 13px; font-size: 1rem; border-radius: var(--radius-md); margin-top: 6px;">
        Sign Up
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Sign In</a>
    </div>
  </div>

  <script>
    (function() {
      const form = document.getElementById('registerForm');
      const nameInput = document.getElementById('regName');
      const emailInput = document.getElementById('regEmail');
      const passwordInput = document.getElementById('regPassword');
      const confirmInput = document.getElementById('regConfirmPassword');
      const submitBtn = document.getElementById('btnRegisterSubmit');
      const statusMsg = document.getElementById('authStatusMsg');
      const googleBtn = document.getElementById('btnGoogleAuth');

      function setStatus(msg, type) {
        if (!msg) {
          statusMsg.style.display = 'none';
          return;
        }
        statusMsg.textContent = msg;
        statusMsg.className = 'auth-status-msg ' + (type || 'error');
        statusMsg.style.display = 'block';
      }

      googleBtn.addEventListener('click', function() {
        window.location.href = '/api/auth/dev-login';
      });

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const confirmPass = confirmInput.value;

        if (!name || !email || !password) {
          setStatus('Please complete all required fields.', 'error');
          return;
        }

        if (password.length < 6) {
          setStatus('Password must be at least 6 characters.', 'error');
          return;
        }

        if (password !== confirmPass) {
          setStatus('Passwords do not match.', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account...';
        setStatus('', '');

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({
              name,
              email,
              password,
              role: 'student',
              grade: 8
            })
          });

          const data = await res.json();
          if (res.ok && data.success) {
            setStatus('Account created! Personalizing your experience...', 'success');
            localStorage.setItem('edusetu_user_prefs', JSON.stringify(data.data.user || { name: name }));
            setTimeout(() => {
              window.location.href = 'onboarding.html';
            }, 700);
          } else {
            setStatus(data.message || 'Failed to create account.', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign Up';
          }
        } catch (err) {
          setStatus('Network error connecting to server.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign Up';
        }
      });
    })();
  </script>
</body>
</html>
