<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign In to EduSetu — Your AI-powered diagnostic learning companion.">
  <title>Sign In — EduSetu</title>

  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/app-shell.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      position: relative;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 40px 36px;
      background: rgba(14, 22, 42, 0.85);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(37, 99, 235, 0.1);
      position: relative;
      z-index: 2;
    }

    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-logo-badge {
      width: 46px;
      height: 46px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
      margin-bottom: 12px;
      color: #fff;
    }

    .auth-brand-name {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.6rem;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .auth-brand-name span {
      color: var(--gold-primary);
    }

    .auth-heading {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 700;
      color: #FFFFFF;
      margin-top: 14px;
      text-align: center;
    }

    .auth-subtitle {
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-align: center;
      margin-top: 6px;
      margin-bottom: 24px;
    }

    .btn-oauth-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      color: var(--text-white);
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      margin-bottom: 18px;
    }

    .btn-oauth-google:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .form-label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .form-forgot-link {
      font-size: 0.8rem;
      color: var(--gold-primary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    .form-forgot-link:hover {
      color: var(--gold-light);
      text-decoration: underline;
    }

    .auth-status-msg {
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }

    .auth-status-msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #FCA5A5;
    }

    .auth-status-msg.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6EE7B7;
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--gold-primary);
      text-decoration: none;
      font-weight: 600;
      margin-left: 4px;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .demo-creds-box {
      margin-top: 20px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }

    .demo-creds-btn {
      background: transparent;
      border: none;
      color: var(--gold-light);
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body class="auth-page">

  <div class="ambient-glow-canvas"></div>

  <div class="auth-card">
    <div class="auth-brand">
      <a href="index.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center;">
        <div class="auth-logo-badge">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        </div>
        <div class="auth-brand-name">Edu<span>Setu</span></div>
      </a>
      <h1 class="auth-heading">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to continue your learning journey</p>
    </div>

    <!-- Google OAuth Button -->
    <button class="btn-oauth-google" id="btnGoogleAuth" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-divider">or continue with email</div>

    <div id="authStatusMsg" class="auth-status-msg"></div>

    <form id="loginForm">
      <div class="form-group">
        <div class="form-label-row">
          <label class="form-label" for="loginEmail">Email</label>
        </div>
        <input type="email" id="loginEmail" class="glass-input" placeholder="Enter your email" required autocomplete="email">
      </div>

      <div class="form-group">
        <div class="form-label-row">
          <label class="form-label" for="loginPassword">Password</label>
          <a href="#" class="form-forgot-link" id="forgotPassLink">Forgot Password?</a>
        </div>
        <input type="password" id="loginPassword" class="glass-input" placeholder="Enter your password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-gold-primary" id="btnSignInSubmit" style="width: 100%; padding: 13px; font-size: 1rem; border-radius: var(--radius-md);">
        Sign In
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Sign Up</a>
    </div>

    <div class="demo-creds-box">
      Need quick demo access? <button type="button" class="demo-creds-btn" id="btnQuickDemo">Fill Student Demo</button>
    </div>
  </div>

  <script>
    (function() {
      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('loginEmail');
      const passwordInput = document.getElementById('loginPassword');
      const submitBtn = document.getElementById('btnSignInSubmit');
      const statusMsg = document.getElementById('authStatusMsg');
      const quickDemoBtn = document.getElementById('btnQuickDemo');
      const googleBtn = document.getElementById('btnGoogleAuth');

      function setStatus(msg, type) {
        if (!msg) {
          statusMsg.style.display = 'none';
          return;
        }
        statusMsg.textContent = msg;
        statusMsg.className = 'auth-status-msg ' + (type || 'error');
        statusMsg.style.display = 'block';
      }

      quickDemoBtn.addEventListener('click', function() {
        emailInput.value = 'student1@edusetu.in';
        passwordInput.value = 'Password123!';
      });

      googleBtn.addEventListener('click', function() {
        // Dev fallback or direct login
        window.location.href = '/api/auth/dev-login';
      });

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          setStatus('Please provide both email and password.', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';
        setStatus('', '');

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ email, password })
          });

          const data = await res.json();
          if (res.ok && data.success) {
            setStatus('Login successful! Redirecting to dashboard...', 'success');
            localStorage.setItem('edusetu_user_prefs', JSON.stringify(data.data.user || { name: 'Student' }));
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 600);
          } else {
            setStatus(data.message || 'Invalid email or password.', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
          }
        } catch (err) {
          setStatus('Network error connecting to server.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      });
    })();
  </script>
</body>
</html>
